<svg width="1200" height="620" viewBox="0 140 1200 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a container ship at sea">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#031e36"/>
      <stop offset="55%" stop-color="#06304f"/>
      <stop offset="100%" stop-color="#0a3f66"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a3f66"/>
      <stop offset="100%" stop-color="#031c33"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e4f7c"/>
      <stop offset="100%" stop-color="#062b4a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="820" fill="url(#sky)"/>

  <!-- chart grid, upper field -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 90H1200M0 170H1200M0 250H1200"/>
    <path d="M120 0V420M340 0V420M560 0V420M780 0V420M1000 0V420"/>
  </g>

  <!-- waypoint markers -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2">
    <circle cx="220" cy="130" r="4" fill="#ffffff" fill-opacity="0.5" stroke="none"/>
    <circle cx="220" cy="130" r="11"/>
    <circle cx="620" cy="90" r="3.5" fill="#ffffff" fill-opacity="0.4" stroke="none"/>
    <circle cx="620" cy="90" r="10"/>
    <circle cx="960" cy="200" r="4.5" fill="#df202c" stroke="none"/>
    <circle cx="960" cy="200" r="13" stroke="#df202c" stroke-opacity="0.55"/>
  </g>
  <path d="M220 130 L620 90 L960 200" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="2 7"/>

  <!-- distant swell -->
  <path d="M0 430 Q150 415 300 430 T600 430 T900 430 T1200 430 V820 H0 Z" fill="url(#sea)" opacity="0.55"/>

  <!-- horizon sea -->
  <rect x="0" y="470" width="1200" height="350" fill="url(#sea)"/>
  <path d="M0 470 Q150 456 300 470 T600 470 T900 470 T1200 470" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

  <!-- ship: hull -->
  <g>
    <path d="M300 620 L340 690 Q560 712 900 690 L945 615 Z" fill="url(#hull)"/>
    <path d="M300 620 L945 615 L940 600 L305 604 Z" fill="#123057"/>
    <!-- waterline highlight -->
    <path d="M340 690 Q560 712 900 690" fill="none" stroke="#dcb45f" stroke-opacity="0.5" stroke-width="2"/>

    <!-- deck containers -->
    <g>
      <rect x="360" y="560" width="58" height="44" fill="#df202c"/>
      <rect x="422" y="556" width="58" height="48" fill="#0e4f7c"/>
      <rect x="484" y="560" width="58" height="44" fill="#f2ede0" fill-opacity="0.85"/>
      <rect x="546" y="552" width="58" height="52" fill="#df202c" fill-opacity="0.85"/>
      <rect x="608" y="560" width="58" height="44" fill="#0e4f7c"/>
      <rect x="360" y="602" width="58" height="16" fill="#0a3659"/>
      <rect x="422" y="602" width="58" height="16" fill="#0a3659"/>
      <rect x="484" y="602" width="58" height="16" fill="#0a3659"/>
      <rect x="546" y="602" width="58" height="16" fill="#0a3659"/>
      <rect x="608" y="602" width="58" height="16" fill="#0a3659"/>
    </g>

    <!-- bridge / superstructure -->
    <g>
      <rect x="700" y="470" width="140" height="150" fill="#123057"/>
      <rect x="716" y="492" width="26" height="22" fill="#dcb45f" fill-opacity="0.85"/>
      <rect x="754" y="492" width="26" height="22" fill="#dcb45f" fill-opacity="0.6"/>
      <rect x="792" y="492" width="26" height="22" fill="#dcb45f" fill-opacity="0.85"/>
      <rect x="716" y="530" width="102" height="10" fill="#0a3659"/>
      <!-- funnel -->
      <rect x="850" y="500" width="34" height="80" fill="#df202c"/>
      <rect x="850" y="500" width="34" height="14" fill="#f2ede0" fill-opacity="0.9"/>
      <!-- mast -->
      <line x1="770" y1="470" x2="770" y2="420" stroke="#123057" stroke-width="5"/>
      <circle cx="770" cy="415" r="4" fill="#df202c"/>
    </g>
  </g>

  <!-- foreground swell -->
  <path d="M0 700 Q100 682 220 700 T440 700 T660 700 T880 700 T1100 700 T1200 700 V820 H0 Z" fill="#031c33"/>
  <path d="M0 700 Q100 682 220 700 T440 700 T660 700 T880 700 T1100 700 T1200 700" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2.5"/>
  <path d="M0 758 Q120 742 260 758 T520 758 T780 758 T1040 758 T1200 758 V820 H0 Z" fill="#021728"/>
</svg>
