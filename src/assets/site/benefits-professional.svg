<svg width="800" height="700" viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration representing a maritime professional's credentials">
  <defs>
    <linearGradient id="proBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a3659"/>
      <stop offset="100%" stop-color="#031e36"/>
    </linearGradient>
  </defs>
  <rect width="800" height="700" fill="url(#proBg)"/>

  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 120H800M0 260H800"/>
    <path d="M140 0V400M400 0V400M660 0V400"/>
  </g>

  <!-- competency badge, simplified flat icon -->
  <g transform="translate(400,290)">
    <path d="M0 -140 L120 -84 L120 20 Q120 118 0 170 Q-120 118 -120 20 L-120 -84 Z" fill="#0e4f7c"/>
    <path d="M0 -118 L98 -70 L98 18 Q98 100 0 144 Q-98 100 -98 18 L-98 -70 Z" fill="#123057"/>
    <path d="M-34 6 L-10 30 L38 -22" fill="none" stroke="#dcb45f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- epaulette stripes, lower left -->
  <g transform="translate(180,470)">
    <rect x="0" y="0" width="120" height="16" fill="#dcb45f"/>
    <rect x="0" y="26" width="120" height="16" fill="#dcb45f"/>
    <rect x="0" y="52" width="80" height="16" fill="#dcb45f"/>
  </g>

  <!-- competency passport / ID card motif -->
  <g transform="translate(560,470)">
    <rect x="-64" y="-42" width="128" height="84" rx="4" fill="#f2ede0" fill-opacity="0.95"/>
    <rect x="-64" y="-42" width="128" height="20" fill="#df202c"/>
    <circle cx="-38" cy="6" r="15" fill="#0a3659" fill-opacity="0.25"/>
    <rect x="-14" y="-2" width="60" height="6" fill="#0a3659" fill-opacity="0.4"/>
    <rect x="-14" y="10" width="46" height="6" fill="#0a3659" fill-opacity="0.3"/>
    <rect x="-14" y="22" width="52" height="6" fill="#0a3659" fill-opacity="0.3"/>
  </g>

  <!-- waterline -->
  <path d="M0 570 Q140 556 280 570 T560 570 T800 570 V700 H0 Z" fill="#031c33"/>
  <path d="M0 570 Q140 556 280 570 T560 570 T800 570" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <path d="M0 626 Q160 612 320 626 T640 626 T800 626 V700 H0 Z" fill="#021728"/>
</svg>
